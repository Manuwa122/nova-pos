<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>NovaPOS — Smart Point of Sale</title><style>

rder-radius:10px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px;margin-bottom:8px}.chip{border:1px solid var(--line);white-space:nowrap;background:white;padding:9px 15px;border-radius:30px;color:#657189;font-weight:650;font-size:13px}.chip.active{background:#eeedff;color:var(--brand);border-color:#dedbff}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}.product{border:1px solid var(--line);background:white;text-align:left;padding:11px;border-radius:15px;transition:.2s}.product:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#ccc8ff}.product .emoji{height:108px;display:grid;place-items:center;font-size:57px;border-radius:11px;margin-bottom:11px}.product strong{display:block;font-size:14px;margin:4px 0}.product small{font-size:12px;color:var(--muted)}.product .price{display:flex;align-items:center;justify-content:space-between;margin-top:13px;font-weight:800}.plus{color:white;background:var(--brand);width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:20px}.cart{position:sticky;top:20px;align-self:start}.carttitle{display:flex;align-items:center;justify-content:space-between}.carttitle h2,.sectiontitle{font-size:18px;margin:0 0 18px}.cartlist{min-height:190px;max-height:340px;overflow:auto}.cartitem{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.cartitem .thumb{height:44px;width:44px;display:grid;place-items:center;border-radius:10px;font-size:23px}.cartitem .detail{flex:1;min-width:0}.cartitem strong{display:block;font-size:13px}.cartitem small{color:var(--muted)}.qty{display:flex;align-items:center;gap:9px}.qty button{border:1px solid var(--line);background:#fff;border-radius:7px;width:25px;height:25px}.totals{border-top:1px dashed #dce0eb;padding-top:15px;margin-top:15px}.totalrow{display:flex;justify-content:space-between;font-size:14px;margin:12px 0;color:#6c778f}.totalrow.grand{color:var(--text);font-size:19px;font-weight:850;padding-top:13px;border-top:1px solid var(--line)}.checkout{width:100%;margin-top:8px;padding:15px}.empty{text-align:center;color:var(--muted);padding:42px 10px;font-size:14px}.empty .big{font-size:44px;display:block;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:19px}.stat small{color:var(--muted);font-weight:650}.stat strong{display:block;font-size:25px;margin:13px 0 5px;letter-spacing:-.7px}.stat .sub{font-size:12px;color:var(--green)}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:17px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th{font-size:12px;color:var(--muted);font-weight:750;background:#fafbfe}th,td{padding:14px;border-bottom:1px solid var(--line)}.tag{padding:5px 9px;border-radius:20px;background:#e8faf2;color:#129368;font-size:12px;font-weight:750}.low{background:#fff0e9;color:#e77933}.actions{display:flex;gap:6px}.actions button{font-size:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:7px;font-weight:650;font-size:13px}.field input,.field select{width:100%;border:1px solid #dce1ee;border-radius:9px;padding:11px;outline:0;background:white}.field.wide{grid-column:span 2}.modalback{position:fixed;inset:0;background:#0a152c88;display:grid;place-items:center;z-index:20;padding:18px}.modal{width:100%;max-width:480px;background:white;border-radius:20px;padding:25px;max-height:95vh;overflow:auto;box-shadow:var(--shadow)}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}.modalhead h2{margin:0;font-size:21px}.iconbtn{border:0;background:#f1f3f7;border-radius:9px;font-size:21px;width:34px;height:34px}.receipt{text-align:center;border:1px dashed #cbd0dc;border-radius:12px;padding:19px;margin:15px 0}.receipt h2{margin:0}.receipt p{font-size:12px;color:var(--muted)}.receiptline{display:flex;justify-content:space-between;margin:9px 0;font-size:13px}.notices{position:fixed;bottom:25px;right:25px;background:#15233a;color:white;padding:13px 19px;border-radius:12px;z-index:30;box-shadow:var(--shadow)}.hint{font-size:12px;color:var(--muted);margin-top:11px}.noresults{padding:32px;color:var(--muted)}.footercta{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}@media(max-width:1050px){.grid{grid-template-columns:1fr}.cart{position:static}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.sidebar{width:65px;padding:20px 7px}.logo{font-size:0;padding:12px 10px}.logo:before{content:'N';font-size:26px}.logo span{display:none}.sidebtn{font-size:0;padding:15px;justify-content:center}.sidebtn i{font-style:normal;font-size:21px}.sidefoot{display:none}.main{padding:17px 12px}.top h1{font-size:21px}.date{display:none}.topright{gap:4px}.padded{padding:13px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product .emoji{height:88px}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:19px}.formgrid{grid-template-columns:1fr}.field.wide{grid-column:auto}}
.langwrap select{border:1px solid var(--line);border-radius:10px;background:white;padding:9px 11px;color:var(--text);max-width:118px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}body:lang(si){font-family:'Noto Sans Sinhala','Iskoola Pota','Segoe UI',system-ui,sans-serif}body:lang(si) button{line-height:1.6}@media(max-width:680px){.topright>span.muted{display:none}.langwrap select{max-width:94px;padding:8px 4px}} @media(max-width:950px){.grid{grid-template-columns:1fr}.cart{position:static}.sidebar{width:70px;padding:18px 7px}.sidebar .logo{font-size:15px;padding:6px}.sidebtn{font-size:0;justify-content:center;padding:14px 7px}.sidebtn i{font-size:20px}.sidefoot{display:none}.main{padding:16px}.cartlist{max-height:none;min-height:75px}}@media(max-width:520px){#app{display:block}.sidebar{width:100%;position:sticky;top:0;z-index:12;display:flex;flex-direction:row;align-items:center;gap:3px;padding:5px 8px;overflow-x:auto}.sidebar .logo{display:none}.sidebtn{width:auto;flex:1;min-width:42px}.main{padding:12px}.searchrow{gap:6px}.searchrow .secondary{padding:10px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.product .emoji{height:75px}.top h1{font-size:20px}.topright{gap:6px}.padded{padding:14px}.panel{border-radius:12px}.grid{gap:12px}}@media(hover:none){.product:hover{transform:none}} </style></head><body><div id="app"><aside class="sidebar"><div class="logo">✦ Nova<span>POS</span></div><button class="sidebtn active" data-page="pos"><i>▦</i> Point of Sale</button><button class="sidebtn" data-page="dashboard"><i>▤</i> Dashboard</button><button class="sidebtn" data-page="inventory"><i>▣</i> Inventory</button><button class="sidebtn" data-page="sales"><i>◷</i> Sales History</button><button class="sidebtn" data-page="settings"><i>⚙</i> Settings</button><div class="sidefoot">NovaPOS • Hardware-ready demo v1.3<br>Data stays in this browser.</div></aside><main class="main"><div class="top"><div><h1 id="pagetitle">Point of Sale</h1><div class="muted date" id="today"></div></div><div class="topright"><label class="langwrap"><span class="sr-only">Interface language</span><select id="language" aria-label="Interface language"><option value="en">English</option><option value="si">සිංහල</option></select></label><span class="muted" style="font-size:13px">Hello, Cashier 👋</span><div class="avatar">MC</div></div></div><div id="content"></div></main></div><div id="modalroot"></div><div id="toastroot"></div><script>
const KEY='novapos_v1';const initial=[{id:1,name:'Classic Burger',category:'Food',price:1250,stock:24,emoji:'🍔',color:'#fff0dd'},{id:2,name:'Margherita Pizza',category:'Food',price:2400,stock:16,emoji:'🍕',color:'#fff0e7'},{id:3,name:'Iced Coffee',category:'Drinks',price:690,stock:38,emoji:'🥤',color:'#eff0ff'},{id:4,name:'French Fries',category:'Snacks',price:650,stock:31,emoji:'🍟',color:'#fff5db'},{id:5,name:'Chocolate Donut',category:'Desserts',price:490,stock:20,emoji:'🍩',color:'#fff0f0'},{id:6,name:'Fresh Orange Juice',category:'Drinks',price:850,stock:18,emoji:'🍊',color:'#fff0db'},{id:7,name:'Chicken Sandwich',category:'Food',price:1050,stock:25,emoji:'🥪',color:'#e7f8e9'},{id:8,name:'Strawberry Cake',category:'Desserts',price:790,stock:12,emoji:'🍰',color:'#ffe9f1'},{id:9,name:'Hot Tea',category:'Drinks',price:280,stock:44,emoji:'🍵',color:'#e8f5e9'},{id:10,name:'Chocolate Cookie',category:'Snacks',price:320,stock:35,emoji:'🍪',color:'#f8ebdf'}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.products)||!Array.isArray(state.sales))state={products:initial,sales:[],settings:{name:'Nova Cafe',tax:0,currency:'LKR'}};state.settings={name:'Nova Cafe',tax:0,currency:'LKR',phone:'',email:'',address:'',receiptNote:'Thank you for shopping with us!',...state.settings};let orderDiscount=0;let cart={},page='pos',category='All',query='';const $=s=>document.querySelector(s),money=n=>(state.settings.currency||'LKR')+' '+Number(n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2}),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('en-LK',{year:'numeric',month:'long',day:'numeric'});$('#today').textContent=today();
function toast(s){$('#toastroot').innerHTML='<div class="notices">'+esc(s)+'</div>';setTimeout(()=>$('#toastroot').innerHTML='',2700)}function nav(p){page=p;document.querySelectorAll('.sidebtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#pagetitle').textContent=({pos:'Point of Sale',dashboard:'Business Overview',inventory:'Product Inventory',sales:'Sales History',settings:'Store Settings'})[p];render()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));function render(){({pos:renderPOS,dashboard:renderDash,inventory:renderInventory,sales:renderSales,settings:renderSettings})[page]()}function subtotal(){return Object.entries(cart).reduce((s,[id,q])=>s+(state.products.find(p=>p.id==id)?.price||0)*q,0)}function tax(){return +(subtotal()*Number(state.settings.tax||0)/100).toFixed(2)}function add(id){const p=state.products.find(p=>p.id===id);if(!p||p.stock<1)return toast('Out of stock');if((cart[id]||0)>=p.stock)return toast('Not enough stock');cart[id]=(cart[id]||0)+1;renderPOS()}function changeQty(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];renderPOS()}function renderPOS(){const cats=['All',...new Set(state.products.map(p=>p.category))];const filtered=state.products.filter(p=>(category==='All'||p.category===category)&&(p.name+' '+(p.sku||'')+' '+(p.barcode||'')).toLowerCase().includes(query.toLowerCase()));$('#content').innerHTML=`<div class="grid"><div class="panel padded"><div class="searchrow"><input id="search" class="search" placeholder="🔎  Search products..." value="${esc(query)}" aria-label="Search products"><button class="secondary" id="clearsearch">Clear</button></div><div class="searchrow"><input id="barcode-input" class="search" inputmode="none" autocomplete="off" placeholder="▥ Scan barcode / SKU (auto-add to bill)" aria-label="Scan barcode"><button class="secondary" id="scan-focus" type="button">▥ Scan</button><button class="secondary" id="camera-scan" type="button">📷 Camera</button><button class="secondary" id="device-status" type="button">⌁ Devices</button></div><div class="chips">${cats.map(c=>`<button class="chip ${category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="products">${filtered.map(p=>`<button class="product" data-add="${p.id}" ${p.stock===0?'disabled':''}><div class="emoji" style="background:${esc(p.color||'#edf0f7')}">${esc(p.emoji||'📦')}</div><strong>${esc(p.name)}</strong><small>${p.stock} in stock · ${esc(p.sku||p.barcode||"No SKU")}</small><div class="price"><span>${money(p.price)}</span><span class="plus">+</span></div></button>`).join('')||'<div class="noresults">No matching products found.</div>'}</div></div><div class="panel padded cart"><div class="carttitle"><h2>🛍 Current Order</h2><button id="clearcart" class="secondary">Clear</button></div><div class="cartlist">${Object.entries(cart).length?Object.entries(cart).map(([id,q])=>{const p=state.products.find(p=>p.id==id);return p?`<div class="cartitem"><div class="thumb" style="background:${esc(p.color||'#eee')}">${esc(p.emoji||'📦')}</div><div class="detail"><strong>${esc(p.name)}</strong><small>${money(p.price*q)}</small></div><div class="qty"><button data-qty="${id}" data-n="-1">−</button><b>${q}</b><button data-qty="${id}" data-n="1">+</button></div></div>`:''}).join(''):'<div class="empty"><span class="big">🛒</span>Your cart is empty.<br>Add products to start an order.</div>'}</div><div class="totals"><div class="totalrow"><span>Subtotal</span><b>${money(subtotal())}</b></div><div class="totalrow"><span>Tax (${Number(state.settings.tax)||0}%)</span><b>${money(tax())}</b></div><label class="field" style="margin:10px 0">Order discount (%)<input id="discount" type="number" min="0" max="100" step="0.5" value="${orderDiscount}"></label><div class="totalrow"><span>Discount</span><b>−${money(discountAmount())}</b></div><div class="totalrow grand"><span>Total</span><span>${money(grandTotal())}</span></div><button class="primary checkout" id="pay" ${!Object.keys(cart).length?'disabled':''}>Charge ${money(grandTotal())} →</button><div class="hint">Cash checkout · Receipt printing · Automatic stock update</div></div></div></div>`;$('#search').oninput=e=>{query=e.target.value;renderPOS();$('#search').focus();$('#search').setSelectionRange(query.length,query.length)};const scanInput=$('#barcode-input');if(scanInput){scanInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();scanProduct(scanInput.value);}};$('#scan-focus').onclick=()=>scanInput.focus();$('#camera-scan').onclick=openCameraScanner;$('#device-status').onclick=showDeviceStatus;}
$('#clearsearch').onclick=()=>{query='';renderPOS()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderPOS()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(Number(b.dataset.add)));document.querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>changeQty(Number(b.dataset.qty),Number(b.dataset.n)));$('#clearcart').onclick=()=>{cart={};renderPOS()};$('#pay').onclick=checkout;$('#discount').onchange=e=>{orderDiscount=Math.min(100,Math.max(0,Number(e.target.value)||0));renderPOS()}}
function modal(html){$('#modalroot').innerHTML='<div class="modalback"><div class="modal">'+html+'</div></div>';$('#modalroot .modalback').onclick=e=>{if(e.target.classList.contains('modalback'))closeModal()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){const wasScanning=cameraRunning;stopCameraScanner();$('#modalroot').innerHTML='';if(wasScanning&&page==='pos')renderPOS()}function discountAmount(){return +(subtotal()*orderDiscount/100).toFixed(2)}function grandTotal(){return Math.max(0,subtotal()-discountAmount()+tax())}function checkout(){const total=grandTotal();modal(`<div class="modalhead"><h2>Complete Payment</h2><button class="iconbtn" data-close>×</button></div><div class="field"><label>Payment method</label><select id="method"><option>Cash</option><option>Card</option><option>Bank Transfer</option></select></div><p style="font-size:29px;font-weight:850">${money(total)}</p><div class="field"><label>Amount received</label><input type="number" id="received" min="0" step="0.01" value="${total.toFixed(2)}"></div><p id="change" class="muted">Change: ${money(0)}</p><div class="footercta"><button class="secondary" data-close>Cancel</button><button class="primary" id="finish">Complete Sale</button></div>`);$('#received').oninput=e=>$('#change').textContent='Change: '+money(Math.max(0,Number(e.target.value)-total));$('#finish').onclick=()=>{const method=$('#method').value,received=Number($('#received').value);if(!Number.isFinite(received)||received<total){toast('Amount received is below total');return}const items=Object.entries(cart).map(([id,qty])=>{const p=state.products.find(x=>x.id==id);return {id:p.id,name:p.name,price:p.price,qty}});if(items.some(i=>(state.products.find(p=>p.id===i.id)?.stock||0)<i.qty))return toast('Insufficient stock');const sale={id:'INV-'+Date.now(),date:new Date().toISOString(),items,subtotal:subtotal(),discount:discountAmount(),discountRate:orderDiscount,tax:tax(),total,method,received,store:{...state.settings}};items.forEach(i=>state.products.find(p=>p.id===i.id).stock-=i.qty);state.sales.unshift(sale);save();cart={};orderDiscount=0;showReceipt(sale);renderPOS();toast('Sale completed successfully!')}}function logoSvg(name){const words=String(name||'N').trim().split(/\s+/);const initials=(words.length>1?words.slice(0,2).map(w=>w[0]).join(''):words[0].slice(0,2)).toUpperCase();let hash=0;for(const c of String(name))hash=(hash*31+c.charCodeAt(0))|0;const hue=Math.abs(hash)%360;return `<svg xmlns="http://www.w3.org/2000/svg" width="78" height="78" viewBox="0 0 78 78" role="img" aria-label="Store logo"><rect width="78" height="78" rx="19" fill="hsl(${hue} 73% 42%)"/><circle cx="63" cy="15" r="17" fill="#ffffff" opacity=".12"/><text x="39" y="49" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="white">${esc(initials)}</text></svg>`}
function receiptMarkup(s){const store=s.store||state.settings;const currency=store.currency||'LKR';const fmt=n=>currency+' '+Number(n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});const line=(label,val)=>`<div class="receiptline"><span>${label}</span><strong>${val}</strong></div>`;return `<div style="text-align:center">${logoSvg(store.name)}<h2 style="margin:7px 0 4px">${esc(store.name||'My Shop')}</h2><div style="font-size:12px;line-height:1.6">${esc(store.address||'')}<br>${esc(store.phone||'')}<br>${esc(store.email||'')}</div><div style="margin:15px 0;font-size:11px;letter-spacing:2px">SALES RECEIPT · විකුණුම් රිසිට්පත</div></div><div style="font-size:12px"><div>Invoice: <b>${esc(s.id)}</b></div><div>Date: ${esc(new Date(s.date).toLocaleString('en-LK'))}</div><div>Payment: ${esc(s.method)}</div></div><hr style="border:0;border-top:1px dashed #aaa;margin:14px 0"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th style="text-align:left">Item / භාණ්ඩය</th><th>Qty</th><th>Price</th><th style="text-align:right">Amount</th></tr></thead><tbody>${s.items.map(i=>`<tr><td style="padding:9px 2px">${esc(i.name)}</td><td style="text-align:center">${i.qty}</td><td style="text-align:right">${fmt(i.price)}</td><td style="text-align:right">${fmt(i.price*i.qty)}</td></tr>`).join('')}</tbody></table><hr style="border:0;border-top:1px dashed #aaa;margin:14px 0">${line('Subtotal / උප එකතුව',fmt(s.subtotal))}${line('Discount / වට්ටම','− '+fmt(s.discount||0))}${line('Tax / බදු',fmt(s.tax))}<div style="border-top:2px solid #222;margin-top:8px;padding-top:8px;font-size:18px">${line('TOTAL / මුළු එකතුව',fmt(s.total))}</div>${line('Received',fmt(s.received))}${line('Change',fmt(Math.max(0,s.received-s.total)))}<div style="text-align:center;margin:22px 0 4px;font-size:12px">${esc(store.receiptNote||'Thank you for shopping with us!')}<br>Powered by NovaPOS</div>`}

function salesTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Date & Time</th><th>Items</th><th>Payment</th><th>Amount</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${esc(s.id)}</b></td><td>${new Date(s.date).toLocaleString()}</td><td>${s.items.reduce((a,i)=>a+i.qty,0)}</td><td>${esc(s.method)}</td><td><b>${money(s.total)}</b></td><td><button class="secondary" data-receipt="${esc(s.id)}">Receipt</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No sales yet. Your first order will appear here.</td></tr>'}</tbody></table></div>`}function bindReceipts(){document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>showReceipt(state.sales.find(s=>s.id===b.dataset.receipt)))}function renderSales(){$('#content').innerHTML=`<div class="panel padded"><div class="toolbar"><h2 class="sectiontitle" style="margin:0">All Transactions (${state.sales.length})</h2><button class="secondary" id="export">↓ Export CSV</button></div>${salesTable(state.sales)}</div>`;bindReceipts();$('#export').onclick=()=>{const rows=[['Invoice','Date','Products','Payment','Subtotal','Tax','Total'],...state.sales.map(s=>[s.id,s.date,s.items.map(i=>i.name+' x'+i.qty).join('; '),s.method,s.subtotal,s.tax,s.total])];download('nova-pos-sales.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}}function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function renderInventory(){$('#content').innerHTML=`<div class="panel padded"><div class="toolbar"><h2 class="sectiontitle" style="margin:0">Products (${state.products.length})</h2><button class="primary" id="newproduct">+ Add Product</button></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Category</th><th>SKU / Barcode</th><th>Price</th><th>Stock</th><th>Manage</th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${esc(p.emoji||'📦')} &nbsp;<b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>${esc(p.sku||p.barcode||"—")}</td><td>${money(p.price)}</td><td><span class="tag ${p.stock<=5?'low':''}">${p.stock} available</span></td><td class="actions"><button class="secondary" data-edit="${p.id}">Edit</button><button class="secondary" data-delete="${p.id}">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`;$('#newproduct').onclick=()=>editProduct();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProduct(Number(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this product?')){state.products=state.products.filter(p=>p.id!==Number(b.dataset.delete));delete cart[b.dataset.delete];save();renderInventory()}})}function editProduct(id){const p=state.products.find(p=>p.id===id)||{name:'',category:'Food',price:0,stock:0,emoji:'📦',color:'#eef0ff'};modal(`<div class="modalhead"><h2>${id?'Edit':'Add'} Product</h2><button class="iconbtn" data-close>×</button></div><form id="productform" class="formgrid"><label class="field wide">Product Name<input name="name" required maxlength="90" value="${esc(p.name)}"></label><label class="field">Category<input name="category" required maxlength="50" value="${esc(p.category)}"></label><label class="field">SKU<input name="sku" maxlength="45" value="${esc(p.sku||'')}"></label><label class="field">Barcode<input name="barcode" maxlength="70" value="${esc(p.barcode||'')}"></label><label class="field">Emoji Icon<input name="emoji" maxlength="8" value="${esc(p.emoji)}"></label><label class="field">Price (${esc(state.settings.currency)})<input name="price" type="number" min="0" step="0.01" required value="${p.price}"></label><label class="field">Stock Quantity<input name="stock" type="number" min="0" step="1" required value="${p.stock}"></label><div class="field wide"><button class="primary" type="submit">Save Product</button></div></form>`);$('#productform').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),data={name:String(fd.get('name')).trim(),category:String(fd.get('category')).trim(),emoji:String(fd.get('emoji')).trim()||'📦',sku:String(fd.get('sku')||'').trim(),barcode:String(fd.get('barcode')||'').trim(),price:Number(fd.get('price')),stock:Number(fd.get('stock'))};if(!data.name||!data.category||!Number.isFinite(data.price)||data.price<0||!Number.isInteger(data.stock)||data.stock<0)return toast('Check product details');if(id)Object.assign(p,data);else state.products.push({...data,id:Date.now(),color:'#eef0ff'});save();closeModal();renderInventory();toast('Product saved')}}

iv></div>`;$('#settingsform [name=name]').oninput=e=>$('#logo-preview').innerHTML=logoSvg(e.target.value);$('#settingsform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.settings={name:String(f.get('name')).trim(),phone:String(f.get('phone')).trim(),email:String(f.get('email')).trim(),address:String(f.get('address')).trim(),receiptNote:String(f.get('receiptNote')).trim(),currency:String(f.get('currency')),tax:Number(f.get('tax'))};save();toast('Settings saved');renderSettings()};$('#backup').onclick=()=>download('nova-pos-backup.json',JSON.stringify(state,null,2),'application/json');$('#restore').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.products)||!Array.isArray(v.sales)||!v.settings)throw Error();if(!confirm('Replace all local POS data with this backup?'))return;state=v;cart={};save();renderSettings();toast('Backup restored')}catch{toast('Invalid backup file')}}}


let cameraStream=null,cameraLoop=null,cameraRunning=false,cameraBusy=false,lastCameraCode='',lastCameraAt=0;
function stopCameraScanner(){
 cameraRunning=false;
 if(cameraLoop){clearTimeout(cameraLoop);cameraLoop=null}
 if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null}
}
function showDeviceStatus(){
 const camera=!!navigator.mediaDevices?.getUserMedia, detector='BarcodeDetector' in window;
 modal(`<div class="modalhead"><h2>Connected device status</h2><button class="iconbtn" data-close>×</button></div>
 <div class="field"><strong>Camera</strong><p>${camera?'Camera API available — permission required':'Not available in this browser or insecure connection'}</p></div>
 <div class="field"><strong>QR / barcode recognition</strong><p>${detector?'Native scanner detection available (actual formats vary)':'Native scanner unavailable — use Chrome/Edge with support or a USB HID scanner'}</p></div>
 <div class="field"><strong>USB / Bluetooth barcode scanner</strong><p>Connect your scanner in HID keyboard mode, then scan a registered barcode to check it. Browser security does not allow reliably listing every connected scanner.</p></div>
 <div class="field"><strong>Thermal printer / payment terminal / cash drawer</strong><p>Connection cannot be verified from this website. Printing uses the system print dialog; direct POS terminal and cash drawer integrations require dedicated drivers or a local companion service.</p></div>
 <div class="field"><strong>Phone as remote scanner</strong><p>Open this website directly on the phone and use Camera. Scanning into a separate computer's bill requires cloud synchronization or a secure companion bridge, which is not yet installed.</p></div>
 <button class="primary" data-close>Close</button>`);
 document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
}
async function openCameraScanner(){
 if(!navigator.mediaDevices?.getUserMedia){toast('Camera unavailable. Open the HTTPS site in a supported browser.');return}
 if(!('BarcodeDetector' in window)){toast('Camera barcode detection unavailable in this browser. Try Chrome or Edge, or use a HID scanner.');return}
 modal(`<div class="modalhead"><h2>📷 Scan QR or barcode</h2><button class="iconbtn" data-close>×</button></div>
 <p>Point your camera at a product barcode or QR code containing its registered SKU/barcode. Scans add items to the current bill.</p>
 <video id="camera-preview" autoplay muted playsinline style="width:100%;max-height:360px;background:#101827;border-radius:14px;object-fit:cover"></video>
 <p id="camera-status" role="status" style="color:#64748b">Requesting camera permission…</p>
 <button class="secondary" data-close>Stop camera</button>`);
 document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
 try{
  const formats=await BarcodeDetector.getSupportedFormats();
  const wanted=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','codabar','qr_code','data_matrix'];
  const available=wanted.filter(f=>formats.includes(f));
  if(!available.length)throw new Error('This browser cannot detect common barcodes or QR codes.');
  const detector=new BarcodeDetector({formats:available});
  const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});
  if(!document.querySelector('#camera-preview')){stream.getTracks().forEach(t=>t.stop());return}
  cameraStream=stream;cameraRunning=true;
  const video=document.querySelector('#camera-preview');video.srcObject=stream;await video.play();
  const status=document.querySelector('#camera-status');
  if(status)status.textContent='Camera connected · Ready to scan ('+available.join(', ')+')';
  toast('Camera connected');
  const tick=async()=>{
   if(!cameraRunning)return;
   if(!cameraBusy&&video.readyState>=2){
    cameraBusy=true;
    try{
     const results=await detector.detect(video);
     const code=results[0]?.rawValue;
     if(code&&!(lastCameraCode===code&&Date.now()-lastCameraAt<1300)){
      lastCameraCode=code;lastCameraAt=Date.now();
      const matches=state.products.filter(p=>[p.barcode,p.sku].some(v=>String(v||'').trim().toLowerCase()===code.trim().toLowerCase()));
      if(matches.length===1){
       if((cart[matches[0].id]||0)<matches[0].stock){
        cart[matches[0].id]=(cart[matches[0].id]||0)+1;
        const output=document.querySelector('#camera-status');
        if(output)output.textContent='✓ '+matches[0].name+' added · quantity '+cart[matches[0].id];
        toast('✓ '+matches[0].name+' added');
       }else{toast('Not enough stock: '+matches[0].name)}
      }else{const output=document.querySelector('#camera-status');if(output)output.textContent=matches.length?'Duplicate barcode: '+code:'Not registered: '+code}
     }
    }catch(err){const output=document.querySelector('#camera-status');if(output)output.textContent='Scanning issue: '+err.message}
    cameraBusy=false;
   }
   if(cameraRunning)cameraLoop=setTimeout(tick,140);
  };
  tick();
 }catch(err){stopCameraScanner();const status=document.querySelector('#camera-status');if(status)status.textContent='Camera error: '+(err?.message||'Permission denied or unsupported');toast('Camera not connected')}
}

// Hardware: USB/Bluetooth HID scanners configured as keyboard + Enter.
// Avoid capturing ordinary typing in forms, and never process checkout/payment from scanner text.
function scanProduct(raw){
 const code=String(raw||'').trim();if(!code)return;
 const matches=state.products.filter(p=>[p.barcode,p.sku].some(v=>String(v||'').trim().toLowerCase()===code.toLowerCase()));
 const field=document.querySelector('#barcode-input');
 if(field)field.value='';
 if(!matches.length){toast('Barcode not found: '+code+' — register it in Inventory');field?.focus();return}
 if(matches.length>1){toast('Duplicate barcode: correct product codes in Inventory');field?.focus();return}
 const p=matches[0];
 if(page!=='pos')nav('pos');
 const previous=cart[p.id]||0;
 add(p.id);
 if((cart[p.id]||0)>previous)toast('✓ '+p.name+' added · Qty '+cart[p.id]);
 requestAnimationFrame(()=>{const next=document.querySelector('#barcode-input');if(next){next.value='';next.focus({preventScroll:true})}});
}
// Scanner-friendly keyboard wedge capture: scan from anywhere on checkout when not typing into an input.
// Requires scanner to transmit characters quickly and terminate with Enter (standard configurable HID mode).
let scanBuffer='',scanLast=0,scanStarted=0;
document.addEventListener('keydown',e=>{
 if(page!=='pos'||e.ctrlKey||e.altKey||e.metaKey||e.repeat)return;
 const target=e.target;
 if(target?.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(target?.tagName))return;
 if(document.querySelector('.modalback'))return;
 const now=performance.now();
 if(now-scanLast>140){scanBuffer='';scanStarted=now}
 scanLast=now;
 if(e.key==='Enter'){
  const code=scanBuffer;const duration=now-scanStarted;scanBuffer='';
  if(code.length>=4&&duration<Math.max(180,code.length*85)){e.preventDefault();scanProduct(code)}
 }else if(e.key.length===1&&scanBuffer.length<90){scanBuffer+=e.key}
 else if(e.key!=='Shift'){scanBuffer=''}
});
// F2 places the cursor in the scanner field. F4 returns to product search.
document.addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();if(page!=='pos')nav('pos');document.querySelector('#barcode-input')?.focus()}else if(e.key==='F4'){e.preventDefault();if(page!=='pos')nav('pos');document.querySelector('#search')?.focus()}});

const uiText=new WeakMap(),uiAttrs=new WeakMap();let language=localStorage.getItem('novapos_language')==='si'?'si':'en';
const translateText=t=>{let v=LABELS[t];if(v)return v;let m;
if((m=/^(\d+) in stock$/.exec(t)))return m[1]+' තොගයේ';
if((m=/^(\d+) available$/.exec(t)))return m[1]+' ඉතිරියි';
if((m=/^Charge (.+) →$/.exec(t)))return 'අය කරන්න '+m[1]+' →';
if((m=/^Tax \((.+)\)$/.exec(t)))return 'බදු ('+m[1]+')';
if((m=/^Change: (.+)$/.exec(t)))return 'ඉතිරිය: '+m[1];
if((m=/^Change (.+)$/.exec(t)))return 'ඉතිරිය '+m[1];
if((m=/^All Transactions \((\d+)\)$/.exec(t)))return 'සියලු ගනුදෙනු ('+m[1]+')';
if((m=/^Products \((\d+)\)$/.exec(t)))return 'භාණ්ඩ ('+m[1]+')';
if((m=/^Price \((.+)\)$/.exec(t)))return 'මිල ('+m[1]+')';
return t;
};
function localize(){document.documentElement.lang=language;document.body.lang=language;const sw=document.querySelector('#language');if(sw)sw.value=language;
const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let node;while(node=w.nextNode()){
if(node.parentElement?.closest('script,style,option,textarea'))continue;
let raw=uiText.get(node);if(raw===undefined){raw=node.nodeValue;uiText.set(node,raw)}
const v=raw.replace(/^(\s*)([\s\S]*?)(\s*)$/,(_,a,b,c)=>a+(language==='si'?translateText(b):b)+c);
if(node.nodeValue!==v)node.nodeValue=v;
}
for(const el of document.querySelectorAll('input[placeholder],input[aria-label]')){
let raw=uiAttrs.get(el);if(!raw){raw={placeholder:el.getAttribute('placeholder'),aria:el.getAttribute('aria-label')};uiAttrs.set(el,raw)}
if(raw.placeholder!==null)el.setAttribute('placeholder',language==='si'?translateText(raw.placeholder):raw.placeholder);
if(raw.aria!==null)el.setAttribute('aria-label',language==='si'?translateText(raw.aria):raw.aria);
}}
const languageSelect=document.querySelector('#language');languageSelect.value=language;
languageSelect.addEventListener('change',e=>{language=e.target.value;localStorage.setItem('novapos_language',language);localize()});
let translationPending=false;const observer=new MutationObserver(()=>{if(translationPending)return;translationPending=true;queueMicrotask(()=>{translationPending=false;localize()})});observer.observe(document.body,{childList:true,subtree:true,characterData:true});

render();localize();</script></body></html>
